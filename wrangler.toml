name = "coursesproj"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "coursesproj-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "coursesproj-media"

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_BASE_URL = "https://your-domain.pages.dev"

# Secrets (set via: wrangler pages secret put SECRET_NAME)
# JWT_SECRET
# CF_STREAM_API_TOKEN  
# CF_ACCOUNT_ID
# R2_PUBLIC_DOMAIN
